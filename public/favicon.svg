<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Same rainbow as the Mix tile -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="#fff" stroke-opacity="0.9" stroke-width="3"/>
  <!-- Candy highlight, like the app tiles -->
  <rect x="9" y="7" width="46" height="22" rx="11" fill="url(#gloss)"/>

  <!-- 9 × 3 -->
  <text x="32" y="45" text-anchor="middle"
        font-family="Varela Round, Nunito, Arial Rounded MT Bold, Arial, Helvetica, sans-serif"
        font-weight="800" font-size="32" fill="#fff"
        stroke="#1e1b4b" stroke-opacity="0.3" stroke-width="1.5" paint-order="stroke"
        letter-spacing="-1.5">9×3</text>
</svg>
